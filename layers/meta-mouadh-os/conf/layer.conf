# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mouadh-os"
BBFILE_PATTERN_meta-mouadh-os = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mouadh-os = "6"

LAYERDEPENDS_meta-mouadh-os = "core"
LAYERSERIES_COMPAT_meta-mouadh-os = "scarthgap"
