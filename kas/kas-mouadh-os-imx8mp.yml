header:
  version: 14

machine: verdin-imx8mp
distro: nodistro
target: mouadh-os

repos:
  meta-freescale:
    url: https://github.com/Freescale/meta-freescale.git
    path: layers/meta-freescale
    branch: scarthgap

  meta-toradex-bsp-common:
    url: https://git.toradex.com/meta-toradex-bsp-common.git
    path: layers/meta-toradex-bsp-common
    branch: scarthgap-7.x.y
  
  meta-toradex-nxp:
    url: https://git.toradex.com/meta-toradex-nxp.git
    path: layers/meta-toradex-nxp
    branch: scarthgap-7.x.y

  meta-freescale-3rdparty:
    url: https://github.com/Freescale/meta-freescale-3rdparty
    path: layers/meta-freescale-3rdparty
    branch: scarthgap

  bitbake:
    url: https://github.com/openembedded/bitbake
    path: layers/bitbake
    branch: "2.8"
    commit: 8dcf084522b9c66a6639b5f117f554fde9b6b45a
    layers:
      bitbake: disabled
  
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    path: layers/openembedded-core
    branch: scarthgap
    commit: d50e4680ed6f930582d907b37c9ed545a89f5c27
    layers:
      meta:

  meta-mouadh-os:
    path: layers/meta-mouadh-os

  meta-mouadh-os-bsp:
    path: layers/meta-mouadh-os-bsp

  meta-mouadh-os-distro:
    path: layers/meta-mouadh-os-distro

bblayers_conf_header:
  standard: |
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""
  
local_conf_header:
  standard: |
    CONF_VERSION = "2"
  diskmon: |
    BB_DISKMON_DIRS = "\
      STOPTASKS,${TMPDIR},1G,100K \
      STOPTASKS,${DL_DIR},1G,100K \
      STOPTASKS,${SSTATE_DIR},1G,100K \
      STOPTASKS,/tmp,100M,100K \
      HALT,${TMPDIR},100M,1K \
      HALT,${DL_DIR},100M,1K \
      HALT,${SSTATE_DIR},100M,1K \
      HALT,/tmp,10M,1K"

env:
  ACCEPT_FSL_EULA: "1"